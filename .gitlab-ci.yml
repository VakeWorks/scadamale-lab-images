# Native multi-arch build of vakeworks/lean-checker: amd64 on a native amd64 runner, arm64 on a
# native arm64 runner -- each real hardware, NO qemu -- then a manifest combines them so
# `docker pull vakeworks/lean-checker:v4.32.0` serves each student their own arch.
#
# CI/CD variables (Settings -> CI/CD -> Variables): DOCKERHUB_USER, DOCKERHUB_TOKEN (push creds).
# NOTE: build:arm64 needs a runner tagged saas-linux-*-arm64 (or a self-hosted/GitHub arm64 runner).
# It is allow_failure so the amd64 leg still publishes while an arm64 runner is being arranged.
stages: [build, manifest]

variables:
  IMAGE: "docker.io/vakeworks/lean-checker"
  TAG: "v4.32.0"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

.build_template: &build_template
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
  script:
    # native build for THIS runner's arch (build context = repo root)
    - docker build --platform "linux/$ARCH" -t "$IMAGE:$TAG-$ARCH" .
    # tests-before-ship: run the kernel self-test INSIDE the container. (Under dind a `-v` bind
    # mount points at the dind daemon fs, not the job fs, so we write the file in-container, to /tmp.)
    - "docker run --rm \"$IMAGE:$TAG-$ARCH\" sh -ec 'echo \"theorem t : 1 + 1 = 2 := rfl\" > /tmp/C.lean; lean /tmp/C.lean'"
    - "if docker run --rm \"$IMAGE:$TAG-$ARCH\" sh -ec 'echo \"theorem t : 1 + 1 = 3 := rfl\" > /tmp/C.lean; lean /tmp/C.lean' 2>/dev/null; then echo \"kernel accepted a FALSE theorem\"; exit 1; fi"
    - docker push "$IMAGE:$TAG-$ARCH"

build:amd64:
  <<: *build_template
  stage: build
  tags: [saas-linux-medium-amd64]
  variables: { ARCH: amd64 }

build:arm64:
  <<: *build_template
  stage: build
  tags: [saas-linux-medium-arm64]
  variables: { ARCH: arm64 }
  allow_failure: true

manifest:
  stage: manifest
  image: docker:27
  services: [docker:27-dind]
  tags: [saas-linux-medium-amd64]
  needs: [build:amd64, build:arm64]
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
  script:
    - docker manifest create "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
    - docker manifest push "$IMAGE:$TAG"
    - echo "published multi-arch $IMAGE:$TAG (amd64+arm64, native, no qemu)"

#
# The 1arch-tools:<release>-build image (1arch-tools of one release + Lean 4.32.0 + TeX Live 2023 + the slide tools,
# no browser) for amd64 and arm64, each built on its own native runner (no qemu), as build-1arch-tools does: each
# platform is pushed by digest, then one job joins the two digests into a manifest list per registry, and checks the
# pushed image carries both tests' markers. It is built FROM the 1arch-tools image of the SAME release, named by its
# index digest.
#
# INSTALL (once, in github.com/VakeWorks/scadamale-lab-images): this file as
# .github/workflows/build-1arch-tools-build.yml, and the folder's other files (Dockerfile, smoke-test-build.sh,
# smoke-test-slides.sh, texlive.profile, entrypoint.sh, 1arch-figure.sh, NOTICE, README.md, fixtures/own-paper/,
# slides/package.json, slides/package-lock.json) as 1arch-tools-build/. Secrets: as
# build-1arch-tools (DOCKERHUB_USER, DOCKERHUB_TOKEN; with gitvw also GITVW_REGISTRY_USER, GITVW_REGISTRY_TOKEN).
# RUN: after build-1arch-tools published <release>: Actions > build-1arch-tools-build > Run workflow, with the 1Arch
# release commit, the index digest of docker.io/vakeworks/1arch-tools:<release> (docker buildx imagetools inspect
# shows it as "Digest:"), and the tag <release>-build.
name: build-1arch-tools-build

on:
  workflow_dispatch:
    inputs:
      onearch_ref:
        description: "the full 40-character 1ArchCodeMathsProveDog commit (the release)"
        required: true
      tools_digest:
        description: "the index digest of docker.io/vakeworks/1arch-tools:<the commit's first 8 characters> (sha256:...)"
        required: true
      tag:
        description: "the image tag: the commit's first 8 characters, then -build"
        required: true
      overwrite:
        description: "replace a tag that already exists (a tag is never moved otherwise)"
        type: boolean
        default: false
      gitvw:
        description: "also publish to git.vake.works/ias/1arch-tools (needs the GITVW_REGISTRY_USER/TOKEN secrets)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GITVW_IMAGE: git.vake.works/ias/1arch-tools
  HUB_IMAGE: docker.io/vakeworks/1arch-tools

jobs:
  inputs:
    runs-on: ubuntu-24.04
    outputs:
      tools_image: ${{ steps.check.outputs.tools_image }}
    steps:
      - name: the commit is 40 hex characters, the digest is a sha256, the tag is <first 8>-build
        id: check
        env:
          REF: ${{ inputs.onearch_ref }}
          DIGEST: ${{ inputs.tools_digest }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "onearch_ref is not a full commit id"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "tools_digest is not sha256:<64 hex>"; exit 1; }
          [ "$TAG" = "${REF:0:8}-build" ] || { echo "tag must be the commit's first 8 characters, then -build"; exit 1; }
          echo "tools_image=docker.io/vakeworks/1arch-tools:${REF:0:8}@${DIGEST}" >> "$GITHUB_OUTPUT"

  build:
    needs: inputs
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ inputs.gitvw }}
        with:
          registry: git.vake.works
          username: ${{ secrets.GITVW_REGISTRY_USER }}
          password: ${{ secrets.GITVW_REGISTRY_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build natively (the Dockerfile's test stage runs on this arch) and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: 1arch-tools-build
          platforms: ${{ matrix.platform }}
          build-args: |
            TOOLS_IMAGE=${{ needs.inputs.outputs.tools_image }}
            ONEARCH_REF=${{ inputs.onearch_ref }}
          outputs: type=image,"name=${{ inputs.gitvw && format('{0},{1}', env.GITVW_IMAGE, env.HUB_IMAGE) || env.HUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
      - name: keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ inputs.gitvw }}
        with:
          registry: git.vake.works
          username: ${{ secrets.GITVW_REGISTRY_USER }}
          password: ${{ secrets.GITVW_REGISTRY_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: one manifest list (amd64 + arm64) per registry
        working-directory: /tmp/digests
        env:
          TAG: ${{ inputs.tag }}
          OVERWRITE: ${{ inputs.overwrite }}
          IMAGES: ${{ inputs.gitvw && format('{0} {1}', env.GITVW_IMAGE, env.HUB_IMAGE) || env.HUB_IMAGE }}
        run: |
          [ "$(ls | wc -l)" = 2 ] || { echo "expected 2 digests (amd64, arm64), got $(ls | wc -l)"; exit 1; }
          # a tag is one release, never moved: refuse one that exists unless overwrite was asked for
          for img in $IMAGES; do
            if docker buildx imagetools inspect "$img:$TAG" > /dev/null 2>&1 && [ "$OVERWRITE" != true ]; then
              echo "$img:$TAG already exists: nothing published (re-run with overwrite to replace it)"; exit 1
            fi
          done
          for img in $IMAGES; do
            docker buildx imagetools create -t "$img:$TAG" $(printf "$img@sha256:%s " *)
            docker buildx imagetools inspect "$img:$TAG"
          done
      - name: the published image carries both tests' markers (amd64)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          docker run --rm --entrypoint cat "$HUB_IMAGE:$TAG" /usr/share/doc/1arch-tools-build/test-passed
          docker run --rm --entrypoint cat "$HUB_IMAGE:$TAG" /usr/share/doc/1arch-tools-build/slides-test-passed

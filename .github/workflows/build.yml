# Native multi-arch build of vakeworks/lean-checker on GitHub-hosted runners (free for public repos,
# NO qemu): amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm. Images are published to OUR Docker Hub
# (docker.io/vakeworks/lean-checker) -- GitHub is ONLY the build compute (CLOUD-Act stop-gap until the
# VW Mac-mini tower + Alexey's Linux tower land; then self-hosted sovereign runners). NOT ghcr.
name: build-lean-checker
on:
  push:
    branches: [main]
    paths: [Dockerfile]   # only the root lean-checker Dockerfile; scadamale-lab/ has its own workflow
  workflow_dispatch: {}

env:
  IMAGE: docker.io/vakeworks/lean-checker
  TAG: v4.32.0

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: docker login (our Docker Hub)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin docker.io
      - name: native build (${{ matrix.arch }})
        run: docker build --platform linux/${{ matrix.arch }} -t "$IMAGE:$TAG-${{ matrix.arch }}" .
      - name: kernel self-test (accept 1+1=2, reject 1+1=3)
        run: |
          docker run --rm "$IMAGE:$TAG-${{ matrix.arch }}" sh -ec 'echo "theorem t : 1 + 1 = 2 := rfl" > /tmp/C.lean; lean /tmp/C.lean'
          if docker run --rm "$IMAGE:$TAG-${{ matrix.arch }}" sh -ec 'echo "theorem t : 1 + 1 = 3 := rfl" > /tmp/C.lean; lean /tmp/C.lean' 2>/dev/null; then
            echo "kernel accepted a FALSE theorem"; exit 1
          fi
      - name: push arch tag to Docker Hub
        run: docker push "$IMAGE:$TAG-${{ matrix.arch }}"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: docker login (our Docker Hub)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin docker.io
      - name: combine + push multi-arch manifest
        run: |
          docker manifest create "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker manifest push "$IMAGE:$TAG"
          echo "published multi-arch $IMAGE:$TAG (amd64+arm64, native, no qemu) to Docker Hub"
